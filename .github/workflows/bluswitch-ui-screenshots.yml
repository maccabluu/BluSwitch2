name: BluSwitch 2 UI screenshots
on:
  push:
    branches:
      - main
    paths:
      - 'bluswitch-ui/**'
      - 'scripts/generate-ui-screenshots.mjs'
      - '.github/workflows/bluswitch-ui-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture BluSwitch 2 Library and Favourites
        run: node scripts/generate-ui-screenshots.mjs
      - name: Publish screenshots to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/library.png docs/screenshots/favourites.png
          if ! git diff --cached --quiet; then
            git commit -m "Update BluSwitch 2 UI screenshots"
            git push origin HEAD:main
          else
            echo "Screenshot previews have not changed"
          fi
