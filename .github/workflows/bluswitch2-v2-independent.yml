name: BluSwitch 2.0 archived native research tests (no APK)
# Manual runs only. No automatic APK builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile synthetic native CPU tests
        working-directory: BluSwitch2-v2
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            app/src/main/cpp/engine_core.cpp tests/test_engine_core.cpp \
            -o /tmp/bluswitch2-v2-tests
          /tmp/bluswitch2-v2-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            app/src/main/cpp/engine_core.cpp app/src/main/cpp/elf_loader.cpp \
            tests/test_elf_loader.cpp -o /tmp/bluswitch2-v2-elf-tests
          /tmp/bluswitch2-v2-elf-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            app/src/main/cpp/engine_core.cpp app/src/main/cpp/game_demo.cpp \
            tests/test_game_demo.cpp -o /tmp/bluswitch2-v2-game-tests
          /tmp/bluswitch2-v2-game-tests

