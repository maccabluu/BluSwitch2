name: BluSwitch 2.0 independent prototype
# Manual runs only. No automatic APK builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile synthetic native CPU tests
        working-directory: BluSwitch2-v2
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            app/src/main/cpp/engine_core.cpp tests/test_engine_core.cpp \
            -o /tmp/bluswitch2-v2-tests
          /tmp/bluswitch2-v2-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            app/src/main/cpp/engine_core.cpp app/src/main/cpp/elf_loader.cpp \
            tests/test_elf_loader.cpp -o /tmp/bluswitch2-v2-elf-tests
          /tmp/bluswitch2-v2-elf-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            app/src/main/cpp/engine_core.cpp app/src/main/cpp/game_demo.cpp \
            tests/test_game_demo.cpp -o /tmp/bluswitch2-v2-game-tests
          /tmp/bluswitch2-v2-game-tests

  isolated-apk:
    needs: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          # The default 'tools' package no longer exists in the SDK repository.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android packages for the new app
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build only BluSwitch 2.0 debug APK
        working-directory: BluSwitch2-v2
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload separate BluSwitch 2.0 test APK
        uses: actions/upload-artifact@v4
        with:
          name: BluSwitch2-v2-independent-debug
          path: BluSwitch2-v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
