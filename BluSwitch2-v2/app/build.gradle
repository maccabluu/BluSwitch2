plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blustudio.bluswitch2.v2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blustudio.bluswitch2.v2'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '2.0.0-dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
