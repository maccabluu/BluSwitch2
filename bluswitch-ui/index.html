<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BluSwitch 2</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app-shell" id="app">
  <div class="wave wave-back"></div><div class="wave wave-front"></div>
  <header class="topbar">
    <button class="brand-bubble" onclick="BluSwitch.open('home')" aria-label="BluSwitch 2 Home"><span class="b-logo"></span></button>
    <div class="top-right">
      <span id="clock" class="clock">12:34</span>
      <svg viewBox="0 0 24 24" class="status-icon"><path d="M2 8c5.9-5 14.1-5 20 0M5.5 11.5c4-3.5 9-3.5 13 0M9 15c2-1.7 4-1.7 6 0"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>
      <svg viewBox="0 0 30 24" class="battery-icon"><rect x="2" y="5" width="23" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="8" width="16" height="8" rx="1" fill="currentColor"/><rect x="26" y="9" width="3" height="6" rx="1" fill="currentColor"/></svg>
    </div>
  </header>
  <main id="main-view" aria-live="polite"></main>
  <footer class="footer">
    <nav class="dock-scroll" aria-label="Main menu"><div id="dock" class="dock"></div></nav>
    <div class="lower-bar">
      <button class="wordmark" onclick="BluSwitch.open('home')"><span class="b-logo large"></span><span>BluSwitch <b>2</b></span></button>
      <span class="status-label">Blu Studio · Native emulator</span>
    </div>
  </footer>
</div>
<script src="settings-hub.js"></script>
<script src="app.js"></script>
</body>
</html>
